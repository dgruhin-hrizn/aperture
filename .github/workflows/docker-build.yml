name: Build and Push Docker Image

on:
  pull_request:
    branches: [main, dev]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Aperture
    runs-on: ubuntu-latest
    services:
      encore-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore-test-only
          POSTGRES_DB: encore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U encore -d encore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENCORE_TEST_DATABASE_URL: postgres://encore:encore-test-only@127.0.0.1:5432/encore_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Compile API schemas and validate published references
        run: pnpm test:schemas

      - name: Test appearance compatibility and preferences
        run: apps/api/node_modules/.bin/tsx --test apps/web/src/appearance/theme.test.cts apps/api/src/routes/auth/appearance.test.ts packages/core/src/lib/appearancePreferences.test.ts

      - name: Test Discovery loading, caches and cancellation
        run: pnpm test:discovery

      - name: Test UI loading, account isolation and read endpoints
        run: pnpm test:ui-performance

      - name: Test upcoming episodes loading, caches and ownership
        run: pnpm test:upcoming

      - name: Test mobile app navigation and keyboard viewport
        run: pnpm test:mobile

      - name: Test Encore conversation continuity and ownership
        run: pnpm test:encore

      - name: Test catalog access, curation and Emby sync
        env:
          APERTURE_TEST_DATABASE_URL: postgres://encore:encore-test-only@127.0.0.1:5432/aperture_test_audit
        run: |
          docker exec "${{ job.services['encore-db'].id }}" createdb -U encore aperture_test_audit
          pnpm test:audit

      - name: Test incremental publishing and Emby load limits
        env:
          APERTURE_TEST_DATABASE_URL: postgres://encore:encore-test-only@127.0.0.1:5432/aperture_test_audit
        run: pnpm test:emby-stability

      - name: Test scheduler times, offsets and partial updates
        env:
          APERTURE_TEST_DATABASE_URL: postgres://encore:encore-test-only@127.0.0.1:5432/aperture_test_audit
        run: pnpm test:job-schedules

      - name: Test output compatibility and documentation links
        run: pnpm test:output-compatibility

      - name: Test LAN and reverse proxy access and sessions
        run: pnpm test:browser-access

  build:
    name: Build and smoke test (${{ matrix.arch }})
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tagged revision
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Check the exact image that will be published
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"
          version=$(docker run --rm --entrypoint node "$image" -p 'require("/app/apps/api/package.json").version')
          test "$version" = "${GITHUB_REF_NAME#v}"
          docker run --rm --entrypoint pg_restore "$image" --version

          docker network create aperture-image-test
          cleanup() {
            docker rm -fv aperture-image-app aperture-image-db >/dev/null 2>&1 || true
            docker network rm aperture-image-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name aperture-image-db --network aperture-image-test --network-alias db \
            -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=fixture-only -e POSTGRES_DB=fixture \
            pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            if docker exec aperture-image-db pg_isready -h 127.0.0.1 -U fixture -d fixture; then break; fi
            sleep 1
          done
          docker run -d --name aperture-image-app --network aperture-image-test -p 127.0.0.1::3456 \
            -e DATABASE_URL=postgres://fixture:fixture-only@db:5432/fixture \
            -e SESSION_SECRET=fixture-release-validation-secret \
            -e RUN_MIGRATIONS_ON_START=true "$image"
          host=$(docker port aperture-image-app 3456/tcp)
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://$host/health" |
              jq -e --arg version "$version" '.ok and .database.connected and .version == $version'; then
              break
            fi
            if [[ "$i" = 60 ]]; then
              docker logs aperture-image-app --tail 100
              exit 1
            fi
            sleep 1
          done
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$IMAGE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  publish:
    name: Publish verified image digests
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: aperture-publish-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish the version and release channel
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Unexpected version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          # A Git tag may have moved while the builds were running.
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"

          exact="$image:$version"
          if inspection=$(docker buildx imagetools inspect "$exact" 2>&1); then
            echo "Image version $version is already published. Use a new version to publish another build." >&2
            exit 1
          elif [[ "$inspection" != *'not found'* && "$inspection" != *'manifest unknown'* ]]; then
            printf '%s\n' "$inspection" >&2
            exit 1
          fi

          tags=(-t "$exact")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            tags+=(-t "$image:latest" -t "$image:${version%.*}")
          elif [[ "$version" =~ -dev\.[0-9]+$ ]]; then
            git fetch --no-tags origin dev
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            tags+=(-t "$image:dev")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
