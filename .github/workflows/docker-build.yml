name: Build and Push Docker Image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    name: Detect Docker Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'apps/**'
              - 'packages/**'
              - 'docker/**'
              - 'db/**'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    services:
      encore-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore-test-only
          POSTGRES_DB: encore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U encore -d encore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENCORE_TEST_DATABASE_URL: postgres://encore:encore-test-only@127.0.0.1:5432/encore_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Compile API schemas and validate published references
        run: pnpm test:schemas

      - name: Test appearance compatibility and preferences
        run: apps/api/node_modules/.bin/tsx --test apps/web/src/appearance/theme.test.cts apps/api/src/routes/auth/appearance.test.ts packages/core/src/lib/appearancePreferences.test.ts

      - name: Test Discovery loading, caches and cancellation
        run: pnpm test:discovery

      - name: Test UI loading, account isolation and read endpoints
        run: pnpm test:ui-performance

      - name: Test upcoming episodes loading, caches and ownership
        run: pnpm test:upcoming

      - name: Test mobile app navigation and keyboard viewport
        run: pnpm test:mobile

      - name: Test Encore conversation continuity and ownership
        run: pnpm test:encore

      - name: Test LAN and reverse proxy access and sessions
        run: pnpm test:browser-access

  docker-amd64:
    name: Build Docker Image (amd64)
    needs: [detect-changes, validate]
    # Tag pushes must bypass the path filter: dorny/paths-filter cannot compute a
    # diff for a tag (it points at an existing commit), so it reports no changed
    # paths and the release build would silently publish nothing.
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.detect-changes.outputs.docker == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      needs_merge: ${{ steps.tags.outputs.needs_merge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ "${{ github.ref }}" == "refs/heads/dev" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "tags=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:build-amd64-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "needs_merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          platforms: linux/amd64

  docker-arm64:
    name: Build Docker Image (arm64)
    needs: [detect-changes, validate]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.detect-changes.outputs.docker == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v')) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-arm64-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          platforms: linux/arm64

  publish-manifest:
    name: Publish Multi-Arch Manifest
    needs: [docker-amd64, docker-arm64]
    if: |
      always() &&
      needs.docker-amd64.result == 'success' &&
      needs.docker-amd64.outputs.needs_merge == 'true' &&
      needs.docker-arm64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=${{ contains(github.ref_name, '-dev.') && 'false' || 'auto' }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-dev.')) }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${{ steps.meta.outputs.tags }}"

          ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && ARGS+=("-t" "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${ARGS[@]}" \
            "${IMAGE}:build-amd64-${{ github.run_id }}" \
            "${IMAGE}:build-arm64-${{ github.run_id }}"
