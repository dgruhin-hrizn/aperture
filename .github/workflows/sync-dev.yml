name: Sync dev with main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance dev when main already contains it
        run: |
          git fetch origin main dev
          if git merge-base --is-ancestor origin/dev origin/main; then
            git push origin origin/main:refs/heads/dev
          else
            echo "Dev has independent commits. A normal merge can bring main into dev."
          fi
